name: Deploy participant sync function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/participant-mutations/**'
      - '.github/workflows/deploy-participant-function.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        if: env.SUPABASE_ACCESS_TOKEN != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy participant-mutations
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy participant-mutations --project-ref qqjeajnrepmawqjqsuup

      - name: Report missing deployment credential
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::warning::Set the SUPABASE_ACCESS_TOKEN repository secret to deploy this function."
