name: Redirect legacy GitHub Pages site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: legacy-pages
  cancel-in-progress: true

jobs:
  deploy-redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload redirect page
        uses: actions/upload-pages-artifact@v3
        with:
          path: legacy-pages

      - name: Deploy redirect page
        id: deployment
        uses: actions/deploy-pages@v4
